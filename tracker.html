<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMW E90 Service Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .container { max-width: 700px; margin: 40px auto; padding: 20px; text-align: center; }
    #serviceList { list-style: none; padding: 0; text-align: left; }
    #serviceList li { background: #f1f1f1; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
    body.dark #serviceList li { background: #2a2a2a; }
    .project-card { background: #fff; padding: 20px; border-radius: 12px; margin: 20px 0; }
    body.dark .project-card { background: #1e1e1e; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="btn" style="background:#555;">← Back to Portfolio</a>
    
    <h1>🚗 BMW E90 320i Service Log</h1>
    <p class="subtitle">Keep track of maintenance and repairs</p>

    <div class="project-card">
      <h2>Recent Work</h2>
      <ul id="serviceList">
        <!-- JavaScript will fill this automatically -->
      </ul>
    </div>

    <h2>Add New Service</h2>
    <button id="addServiceBtn">➕ Log New Service</button>

  </div>

</body>
</html>
<script src="script.js"></script>
